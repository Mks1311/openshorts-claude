<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <!-- viewport-fit=cover so the bottom tab bar can pad itself past the iOS home
       indicator with env(safe-area-inset-bottom); without it that inset reads 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark" />
  <!-- A personal install: nothing here is meant for search engines. -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Instrument Serif (display), Geist (body), JetBrains Mono (labels), served
       from this origin (public/fonts.css): no request to a font CDN. -->
  <link rel="stylesheet" href="/fonts.css" />

  <title>shorts maxxing</title>
  <meta name="description" content="Turn long videos into vertical shorts with Claude, on your own machine." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
